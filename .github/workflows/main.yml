name: Build APK

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # NDK suka gagal di runner, retry 3x
      - name: Install NDK
        run: |
          yes | sdkmanager --licenses || true
          for i in 1 2 3; do
            if sdkmanager --install "ndk;26.1.10909125"; then
              echo "NDK installed on attempt $i"
              break
            fi
            echo "Attempt $i failed, retrying"
            sleep 15
            rm -rf /usr/local/lib/android/sdk/ndk/26.1.10909125
          done
          sdkmanager --list_installed | grep ndk || echo "NDK check failed"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Fix android-37 SDK naming (runner installs as android-37.0)
        run: ln -sf $ANDROID_SDK_ROOT/platforms/android-37.0 $ANDROID_SDK_ROOT/platforms/android-37 || true


      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        continue-on-error: true

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MP-Manager-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn