// Konfigurasi Gradle untuk seluruh modul.
buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.2'
        // Dependensi aplikasi ditaruh di build.gradle modul,
        // bukan di file ini.
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
